<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Dashboard CRUD Mahasiswa</title>
</head>
<body>
    <h2>Dashboard CRUD Mahasiswa</h2>
    <a href="/login.html">Logout</a>
    <hr>

    <h3>Tambah Mahasiswa</h3>
    <form id="addForm">
        <input type="text" id="nim" placeholder="NIM" required>
        <input type="text" id="nama" placeholder="Nama" required>
        <input type="text" id="jurusan" placeholder="Jurusan" required>
        <button type="submit">Simpan</button>
    </form>

    <hr>

    <h3>Cari Mahasiswa (Rentan SQLi)</h3>
    <input type="text" id="searchInput" placeholder="Cari nama/NIM...">
    <button onclick="loadMahasiswa()">Cari</button>

    <h3>Daftar Mahasiswa</h3>
    <table border="1" cellpadding="5" cellspacing="0">
        <thead>
            <tr>
                <th>ID</th>
                <th>NIM</th>
                <th>Nama</th>
                <th>Jurusan</th>
                <th>Aksi</th>
            </tr>
        </thead>
        <tbody id="mhsTableBody">
            <!-- Data dimuat lewat JS -->
        </tbody>
    </table>

    <script>
        async function loadMahasiswa() {
            const search = document.getElementById('searchInput').value;
            const res = await fetch(`/api/mahasiswa?search=${encodeURIComponent(search)}`);
            const data = await res.json();
            
            const tbody = document.getElementById('mhsTableBody');
            tbody.innerHTML = '';
            
            if(Array.isArray(data)) {
                data.forEach(m => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${m.id}</td>
                            <td>${m.nim}</td>
                            <td>${m.nama}</td>
                            <td>${m.jurusan}</td>
                            <td><button onclick="hapusData(${m.id})">Hapus</button></td>
                        </tr>
                    `;
                });
            } else {
                tbody.innerHTML = `<tr><td colspan="5">Error: ${JSON.stringify(data)}</td></tr>`;
            }
        }

        document.getElementById('addForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nim = document.getElementById('nim').value;
            const nama = document.getElementById('nama').value;
            const jurusan = document.getElementById('jurusan').value;

            await fetch('/api/mahasiswa', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nim, nama, jurusan })
            });

            document.getElementById('addForm').reset();
            loadMahasiswa();
        });

        async function hapusData(id) {
            if(confirm('Yakin ingin hapus?')) {
                await fetch(`/api/mahasiswa/${id}`, { method: 'DELETE' });
                loadMahasiswa();
            }
        }

        // Load data awal
        loadMahasiswa();
    </script>
</body>
</html>
